<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera — VIA Provisiones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Montserrat:wght@500&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: Roboto, system-ui, sans-serif; font-size: 17px; letter-spacing: 0.02em; color: #111111; background: #FFFFFF; position: relative; z-index: 20">

<!-- Barra de avisos -->
<div style="background: {{accent}}; color: #111111; font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; text-transform: uppercase; height: 48px; overflow: hidden; display: flex; align-items: center; white-space: nowrap">
<div class="marquee" style="display: flex; align-items: center; flex: none">
<sc-for list="{{ticker}}" as="t" hint-placeholder-count="20">
<span style="display: inline-flex; align-items: center; gap: 28px; padding-right: 28px">{{t.label}}<span style="width: 6px; height: 6px; border-radius: 50%; background: #111111"></span></span>
</sc-for>
</div>
</div>

<!-- Cabecera -->
<header style="background: #FFFFFF; border-bottom: 1px solid #111111">
<div style="max-width: 1520px; margin: 0 auto; padding: 0 40px; position: relative">
<div style="min-height: 88px; display: flex; align-items: center; gap: 24px; justify-content: space-between; flex-wrap: wrap">
<a href="Main.dc.html" aria-label="VIA Provisiones, inicio" style="display: flex; align-items: center; text-decoration: none">
<svg width="176" height="58" viewBox="134 205 278 92" role="img" aria-label="VIA Provisiones">
<circle cx="178.6" cy="247.5" r="39.4" fill="none" stroke="{{accent}}" stroke-width="3"></circle>
<clipPath id="via-clip-hdr"><circle cx="178.6" cy="247.5" r="40.5"></circle></clipPath>
<polygon points="178.6,222.5 208.5,261.5 178.6,251 149,261.5" fill="{{accent}}"></polygon>
<path clip-path="url(#via-clip-hdr)" d="M136 270.5 C158 271, 174 265, 190 264.6 C200 264.4, 208 267.5, 221 271 L221 292 L136 292 Z" fill="{{accent}}"></path>
<g fill="none" stroke="#111111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M242.6 229 L257.8 248.25 L281.1 229"></path><path d="M310.1 248 L334.3 228 L349.6 248"></path><path d="M295.8 229 V248.25"></path></g>
<text transform="translate(0 283.4) skewX(-12) translate(0 -283.4)" x="229" y="283.4" textLength="178" lengthAdjust="spacing" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="{{accent}}">PROVISIONES</text>
</svg>
</a>
<div style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: flex-end">
<label style="position: relative; display: flex; align-items: center; width: 440px; max-width: 80vw; height: 46px; border: 1px solid #111111; border-radius: 999px; padding: 0 6px 0 18px; box-sizing: border-box">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar productos</span>
<input type="search" placeholder="Buscar focos, paneles solares, camping…" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #111111; outline: none">
<a href="Busqueda.dc.html" aria-label="Buscar" style="width: 34px; height: 34px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></a>
</label>
<sc-for list="{{topLinks}}" as="l" hint-placeholder-count="3">
<a href="{{l.href}}" style="text-decoration: none; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border-bottom: {{l.underline}}; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg>{{l.label}}</a>
</sc-for>
<a href="https://wa.me/51954802744" aria-label="WhatsApp +51 954 802 744" style="width: 40px; height: 40px; border-radius: 50%; background: #25D366; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.4L3 21l4.7-1.2A9 9 0 1 0 12 3z" fill="#FFFFFF"></path><path d="M9.2 7.8c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.9 4.5 3.9 2.2.9 2.7.7 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3l-1.7-.8c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.9z" fill="#25D366"></path></svg></a>
<a href="MiCuenta.dc.html" aria-label="Mi cuenta" style="width: 32px; height: 44px; color: #111111; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
<a href="Carrito.dc.html" aria-label="Carrito" style="position: relative; width: 40px; height: 40px; border-radius: 50%; background: {{accent}}; color: #111111; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.2 11h11l2-8H6.2"></path><circle cx="9" cy="19" r="1.3"></circle><circle cx="17" cy="19" r="1.3"></circle></svg>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: #111111; color: #FFFFFF; font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{cartCount}}</span></sc-if>
</a>
</div>
</div>

<!-- Menú de categorías con subcategorías -->
<nav aria-label="Categorías" style="border-top: 1px solid #111111; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 4px 28px; flex-wrap: wrap">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
<button onClick="{{m.toggle}}" aria-expanded="{{m.expanded}}" style="border: none; background: transparent; cursor: pointer; padding: 0 2px; min-height: 44px; font-family: Archivo, sans-serif; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: #111111; display: inline-flex; align-items: center; gap: 8px; border-bottom: {{m.underline}}">{{m.name}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="{{m.chevron}}"></path></svg></button>
</sc-for>
<a href="Categoria.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-size: 15px; font-weight: 800; text-transform: uppercase; text-decoration: none; color: #111111"><span style="background: {{accent}}; padding: 4px 10px; border-radius: 999px">Ofertas</span></a>
</nav>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 40px; right: 40px; top: 100%; background: #FFFFFF; border: 1px solid #111111; border-top: 4px solid {{accent}}; border-radius: 0 0 16px 16px; padding: 32px; display: flex; flex-wrap: wrap; gap: 32px; box-shadow: 0 18px 40px rgba(0,0,0,0.12)">
<div style="flex: 0 1 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 700; text-transform: uppercase">Categoría</span>
<span style="font-family: Archivo, sans-serif; font-size: 36px; font-weight: 900; text-transform: uppercase; line-height: 1">{{current.name}}</span>
<span style="font-size: 16px; line-height: 1.5">{{current.blurb}}</span>
<a href="Categoria.dc.html" onClick="{{closeMenu}}" style="align-self: flex-start; margin-top: 6px; display: inline-flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 999px; background: {{accent}}; color: #111111; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; text-transform: uppercase">Ver todo</a>
</div>
<ul style="flex: 1 1 320px; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; align-content: start">
<sc-for list="{{current.subs}}" as="s" hint-placeholder-count="5">
<li><a href="Categoria.dc.html" onClick="{{closeMenu}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-bottom: 1px solid #111111; text-decoration: none; font-family: Archivo, sans-serif; font-size: 17px; font-weight: 700; text-transform: uppercase; color: #111111">{{s.name}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></li>
</sc-for>
</ul>
<img src="{{current.img}}" alt="" style="flex: 0 1 300px; width: 300px; max-width: 100%; height: 220px; object-fit: cover; border-radius: 12px">
<button onClick="{{closeMenu}}" aria-label="Cerrar menú" style="position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 1px solid #111111; border-radius: 50%; background: #FFFFFF; color: #111111; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>
</div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF914C","options":["#FF914C","#FF5F00","#F27420"]},"cart":{"editor":"int","default":0,"min":0,"max":99},"active":{"editor":"enum","default":"","options":["","Empresas","Redes","Nosotros"]},"$preview":{"width":1440,"height":200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: -1 };
  }
  renderVals() {
    const B = 'img/';
    const accent = this.props.accent ?? '#FF914C';
    const cart = Number(this.props.cart ?? 0);
    const active = this.props.active ?? '';
    const open = this.state.open;
    const cats = [
      { name: 'Focos', img: B + '3b9c9685b295f2e98de45092f0726e9d', blurb: 'Iluminación LED e inteligente para cada espacio.', subs: ['Focos LED', 'Focos inteligentes', 'Focos ahorradores', 'Reflectores', 'Tiras LED'] },
      { name: 'Solar', img: B + 'b30fccfdffef62630e634c81713bce27', blurb: 'Energía del sol para tu casa, tu negocio o tu campamento.', subs: ['Paneles solares', 'Estaciones de energía', 'Lámparas solares', 'Baterías e inversores', 'Kits solares'] },
      { name: 'Cables', img: B + '9b50c161cb5babd38f32f5ae0d6d07f2', blurb: 'Carga, video, red y audio con conexiones confiables.', subs: ['Cables USB', 'Cables HDMI', 'Cables de red', 'Cables de audio', 'Cable eléctrico'] },
      { name: 'Extensiones', img: B + 'eb24768cbcec06634442ffd75b2ec35e', blurb: 'Energía donde la necesites, en casa o en el taller.', subs: ['Multicontactos', 'Extensiones de uso rudo', 'Carretes', 'Supresores de picos'] },
      { name: 'Llaveros', img: B + '486adc8e3498d09ac8c8b3601331de4e', blurb: 'Lleva tus llaves en orden y con estilo.', subs: ['Llaveros de metal', 'Llaveros de piel', 'Mosquetones', 'Llaveros personalizados'] },
      { name: 'Ganchos', img: B + '2199c77bc313fc070c4dd0829072f7f7', blurb: 'Organiza paredes, cocina y entrada sin complicaciones.', subs: ['Ganchos adhesivos', 'Ganchos de pared', 'Ganchos de cocina', 'Organizadores'] },
      { name: 'Camping', img: B + 'a39c65aefaa4235a16422fb671911427', blurb: 'Equipo para acampar con luz, comodidad y seguridad.', subs: ['Lámparas y linternas', 'Casas de campaña', 'Cocina de campamento', 'Mochilas', 'Sillas plegables'] },
      { name: 'Bisutería', img: B + 'c293f47caea74d301a56eedd46949711', blurb: 'Accesorios para completar cualquier look.', subs: ['Collares', 'Pulseras', 'Aretes', 'Anillos', 'Sets'] }
    ];
    const cur = open >= 0 ? cats[open] : cats[0];
    const links = [
      { label: 'Empresas', href: 'Empresas.dc.html', icon: 'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6' },
      { label: 'Redes', href: 'Enlaces.dc.html', icon: 'M8 12h8M10 8H7a4 4 0 0 0 0 8h3M14 8h3a4 4 0 0 1 0 8h-3' },
      { label: 'Nosotros', href: 'Main.dc.html', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6' }
    ];
    return {
      accent,
      cartCount: cart,
      hasCart: cart > 0,
      topLinks: links.map((l) => ({ ...l, underline: l.label === active ? '3px solid ' + accent : '3px solid transparent' })),
      ticker: [0, 1].flatMap(() => ['Envío a todo el Perú desde Arequipa', 'WhatsApp +51 954 802 744', 'Precios por mayor y menor', 'Pago con tarjeta, Yape o Plin', 'Focos LED e inteligentes', 'Paneles solares y energía portátil', 'Cables y extensiones', 'Todo para camping', 'Bisutería nueva cada semana', 'Boleta o factura electrónica'].map((label) => ({ label }))),
      menu: cats.map((c, i) => ({
        name: c.name,
        expanded: open === i ? 'true' : 'false',
        underline: open === i ? '3px solid ' + accent : '3px solid transparent',
        chevron: open === i ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
      })),
      menuOpen: open >= 0,
      current: { name: cur.name, blurb: cur.blurb, img: cur.img, subs: cur.subs.map((name) => ({ name })) },
      closeMenu: () => this.setState({ open: -1 })
    };
  }
}
</script>
</body>
</html>
