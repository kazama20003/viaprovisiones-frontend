<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Camping — VIA Provisiones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Montserrat:wght@500&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#E8701F}
.marquee{animation:via-marquee 40s linear infinite}
@keyframes via-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.marquee{animation:none}}
</style>
</helmet>
<div style="font-family: Roboto, system-ui, sans-serif; font-size: 17px; letter-spacing: 0.02em; color: #111111; background: #FFFFFF; min-height: 100vh">

<dc-import name="Header" accent="{{accent}}" cart="{{cart}}" active="" hint-size="100%,200px"></dc-import>

<main style="max-width: 1520px; margin: 0 auto; padding: 0 40px 80px">

<!-- Migas y banner -->
<nav aria-label="Ruta" style="padding: 24px 0; font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; display: flex; gap: 10px">
<a href="Main.dc.html" style="text-decoration: none">Inicio</a><span aria-hidden="true">/</span><span>Camping</span>
</nav>
<section style="position: relative; height: 320px; border-radius: 20px; overflow: hidden; background: #111111">
<img src="img/a39c65aefaa4235a16422fb671911427" alt="Casa de campaña de noche" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; left: 32px; bottom: 32px; background: #FFFFFF; border-top: 6px solid {{accent}}; padding: 24px 28px; max-width: 520px">
<h1 style="margin: 0 0 8px; font-family: Archivo, sans-serif; font-weight: 900; font-size: 56px; line-height: 1; text-transform: uppercase">Camping</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5">Equipo para acampar con luz, comodidad y seguridad.</p>
</div>
</section>

<!-- Filtros + productos -->
<div style="display: flex; flex-wrap: wrap; gap: 40px; padding-top: 40px">

<aside style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 32px">
<div>
<h2 style="margin: 0 0 14px; font-family: Archivo, sans-serif; font-size: 16px; font-weight: 800; text-transform: uppercase">Subcategorías</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{subs}}" as="s" hint-placeholder-count="6">
<button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 16px; border-radius: 999px; border: 2px solid #111111; background: {{s.bg}}; color: #111111; cursor: pointer; font-family: Roboto, sans-serif; font-size: 15px; font-weight: 500; text-align: left">{{s.name}}<span style="font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 700">{{s.count}}</span></button>
</sc-for>
</div>
</div>
<div>
<h2 style="margin: 0 0 14px; font-family: Archivo, sans-serif; font-size: 16px; font-weight: 800; text-transform: uppercase">Precio</h2>
<div style="display: flex; gap: 10px">
<label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 700; text-transform: uppercase">Desde<input type="text" value="S/ 0" style="height: 44px; border: 1px solid #111111; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 14px"></label>
<label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 700; text-transform: uppercase">Hasta<input type="text" value="S/ 1,500" style="height: 44px; border: 1px solid #111111; border-radius: 10px; padding: 0 12px; font-family: inherit; font-size: 14px"></label>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 2px; font-family: Archivo, sans-serif; font-size: 16px; font-weight: 800; text-transform: uppercase">Disponibilidad</h2>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #111111">En stock</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #111111">En oferta</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #111111">Precio por volumen (empresas)</label>
</div>
</aside>

<section style="flex: 999 1 640px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px">
<span style="font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; text-transform: uppercase">{{resultLabel}}</span>
<label style="display: flex; align-items: center; gap: 10px; font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase">Ordenar
<select style="height: 44px; border: 2px solid #111111; border-radius: 999px; padding: 0 16px; font-family: Roboto, sans-serif; font-size: 15px; background: #FFFFFF">
<option>Más vendidos</option><option>Precio: menor a mayor</option><option>Precio: mayor a menor</option><option>Novedades</option>
</select></label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 36px 20px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<article style="display: flex; flex-direction: column">
<a href="Producto.dc.html" style="position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 19px; overflow: hidden">
<img src="{{p.img}}" alt="{{p.name}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<sc-if value="{{p.badge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 12px; left: 12px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 999px">{{p.badge}}</span></sc-if>
</a>
<span style="margin-top: 14px; font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 700; text-transform: uppercase">Camping · {{p.sub}}</span>
<h3 style="margin: 6px 0 0; font-family: Archivo, sans-serif; font-size: 17px; font-weight: 700; text-transform: uppercase; line-height: 1.3; min-height: 44px"><a href="Producto.dc.html" style="text-decoration: none">{{p.name}}</a></h3>
<div style="margin-top: 10px; display: flex; gap: 8px; font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700"><span>{{p.price}}</span><sc-if value="{{p.was}}" hint-placeholder-val="{{ false }}"><s style="font-weight: 500; color: #555555">{{p.was}}</s></sc-if></div>
<button onClick="{{add}}" style="margin-top: 12px; height: 46px; border-radius: 999px; border: 2px solid #111111; background: #FFFFFF; color: #111111; font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer">Añadir al carrito</button>
</article>
</sc-for>
</div>
<nav aria-label="Páginas" style="display: flex; justify-content: center; gap: 8px; margin-top: 56px">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Roboto Mono', monospace; font-weight: 700">1</span>
<a href="Categoria.dc.html" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #111111; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Roboto Mono', monospace; font-weight: 700; text-decoration: none">2</a>
<a href="Categoria.dc.html" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #111111; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Roboto Mono', monospace; font-weight: 700; text-decoration: none">3</a>
</nav>
</section>
</div>
</main>

<dc-import name="Footer" accent="{{accent}}" hint-size="100%,980px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF914C","options":["#FF914C","#FF5F00","#F27420"]},"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sub: 'Todo', cart: 0 };
  }
  renderVals() {
    const B = 'img/';
    const accent = this.props.accent ?? '#FF914C';
    const all = [
      { sub: 'Lámparas y linternas', name: 'Lámpara de camping recargable', price: 'S/ 69.90', img: 'a58999411e32d7481815ba8cdc175e97', badge: 'Más vendido', dark: true },
      { sub: 'Lámparas y linternas', name: 'Linterna de cabeza LED', price: 'S/ 39.90', was: 'S/ 54.90', img: '9b85b845faa6856c6338458b006ed014', badge: 'Oferta' },
      { sub: 'Cocina de campamento', name: 'Set de cocina para campamento', price: 'S/ 129.00', img: 'a5d2725814df1e3e53351e1060258c0c' },
      { sub: 'Casas de campaña', name: 'Casa de campaña para 4 personas', price: 'S/ 389.00', img: 'a39c65aefaa4235a16422fb671911427' },
      { sub: 'Casas de campaña', name: 'Casa de campaña para 2 personas', price: 'S/ 229.00', img: '6bfeade76520c7a9cd478f997069e6ca' },
      { sub: 'Lámparas y linternas', name: 'Kit solar plegable para camping', price: 'S/ 459.00', img: 'b6ecf2ad3d873fbfa09db032a5d5c447', badge: 'Pocas unidades' },
      { sub: 'Mochilas', name: 'Mochila de trekking 45 L', price: 'S/ 179.00', img: '270fef37ab257fc6383d3c904a7f2911' },
      { sub: 'Sillas plegables', name: 'Silla plegable con portavasos', price: 'S/ 89.00', img: '5bcbbd21ce25a9016f20a6456029204e' },
      { sub: 'Lámparas y linternas', name: 'Linterna táctica recargable', price: 'S/ 59.90', img: '621ce65a45113393656af23955c4e044' }
    ];
    const names = ['Todo', 'Lámparas y linternas', 'Casas de campaña', 'Cocina de campamento', 'Mochilas', 'Sillas plegables'];
    const cur = this.state.sub;
    const items = all.filter((p) => cur === 'Todo' || p.sub === cur).map((p) => ({
      ...p,
      img: B + p.img,
      was: p.was || '',
      badge: p.badge || '',
      badgeBg: p.badge === 'Más vendido' ? '#111111' : accent,
      badgeFg: p.badge === 'Más vendido' ? '#FFFFFF' : '#111111'
    }));
    return {
      accent,
      cart: this.state.cart,
      hasCart: this.state.cart > 0,
      add: () => this.setState({ cart: this.state.cart + 1 }),
      subs: names.map((name) => ({
        name,
        count: String(name === 'Todo' ? all.length : all.filter((p) => p.sub === name).length),
        pressed: cur === name ? 'true' : 'false',
        bg: cur === name ? accent : '#FFFFFF',
        pick: () => this.setState({ sub: name })
      })),
      items,
      resultLabel: items.length + ' productos'
    };
  }
}
</script>
</body>
</html>
