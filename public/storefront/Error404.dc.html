<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página no encontrada — VIA Provisiones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Montserrat:wght@500&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#E8701F}
</style>
</helmet>
<div style="font-family: Roboto, system-ui, sans-serif; font-size: 17px; letter-spacing: 0.02em; color: #111111; background: #FFFFFF; min-height: 100vh">

<dc-import name="Header" accent="{{accent}}" cart="0" active="" hint-size="100%,200px"></dc-import>

<main style="max-width: 1520px; margin: 0 auto; padding: 40px 40px 80px; display: flex; flex-direction: column; gap: 48px">

<!-- Bloque principal -->
<section style="display: flex; flex-wrap: wrap; align-items: center; gap: 40px; border-radius: 28px; background: #111111; color: #FFFFFF; padding: 56px; box-sizing: border-box; overflow: hidden">
<div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: 22px">
<span style="align-self: flex-start; background: {{accent}}; color: #111111; font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700; text-transform: uppercase; padding: 6px 14px; border-radius: 999px">Error 404 · Página no encontrada</span>
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-size: 84px; font-weight: 900; line-height: 0.92; text-transform: uppercase">Esta ruta se quedó sin luz</h1>
<p style="margin: 0; max-width: 560px; font-size: 19px; line-height: 1.5; color: #E8E8E8">La página que buscas no existe o cambió de lugar. Busca lo que necesitas o vuelve a un camino iluminado.</p>
<label style="display: flex; align-items: center; gap: 12px; height: 64px; max-width: 620px; padding: 0 8px 0 22px; border-radius: 999px; background: #FFFFFF; box-sizing: border-box">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar productos</span>
<input type="search" placeholder="Buscar focos, cables, linternas…" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: Roboto, sans-serif; font-size: 17px; color: #111111">
<a href="Busqueda.dc.html" style="height: 48px; padding: 0 24px; border-radius: 999px; background: {{accent}}; color: #111111; display: flex; align-items: center; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; text-transform: uppercase">Buscar</a>
</label>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<a href="Main.dc.html" style="height: 56px; padding: 0 28px; border-radius: 999px; background: {{accent}}; color: #111111; display: flex; align-items: center; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; text-transform: uppercase">Ir al inicio</a>
<a href="Categoria.dc.html" style="height: 56px; padding: 0 28px; border-radius: 999px; border: 2px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; text-transform: uppercase">Ver catálogo</a>
<a href="https://wa.me/51954802744" style="height: 56px; padding: 0 28px; border-radius: 999px; border: 2px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; text-transform: uppercase"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.4-4A8 8 0 1 1 8 18.6z"></path></svg>Escribir por WhatsApp</a>
</div>
</div>

<!-- Linterna con haz de luz (formas simples) -->
<div style="flex: 1 1 420px; display: flex; justify-content: center">
<svg width="460" height="360" viewBox="0 0 460 360" role="img" aria-label="Linterna apuntando a un 404 iluminado">
<polygon points="150,150 460,20 460,300" fill="{{accent}}" opacity="0.22"></polygon>
<polygon points="150,150 460,80 460,240" fill="{{accent}}" opacity="0.35"></polygon>
<text x="300" y="196" text-anchor="middle" font-family="Archivo, sans-serif" font-size="110" font-weight="900" fill="#FFFFFF">404</text>
<rect x="20" y="128" width="100" height="44" rx="14" fill="#FFFFFF"></rect>
<rect x="38" y="140" width="22" height="20" rx="5" fill="#111111"></rect>
<rect x="72" y="140" width="10" height="20" rx="3" fill="{{accent}}"></rect>
<path d="M118 120 L150 108 L150 192 L118 180 Z" fill="#FFFFFF"></path>
<rect x="148" y="106" width="10" height="88" rx="4" fill="{{accent}}"></rect>
<circle cx="70" cy="252" r="5" fill="{{accent}}"></circle>
<circle cx="104" cy="282" r="3" fill="#FFFFFF" opacity="0.6"></circle>
<circle cx="40" cy="300" r="4" fill="#FFFFFF" opacity="0.4"></circle>
</svg>
</div>
</section>

<!-- Categorías populares -->
<section style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<h2 style="margin: 0; font-family: Archivo, sans-serif; font-size: 36px; font-weight: 900; text-transform: uppercase">Lo más buscado</h2>
<a href="Categoria.dc.html" style="font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; text-transform: uppercase; text-underline-offset: 4px">Ver todas las categorías</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<a href="Categoria.dc.html" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none">
<span style="position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 19px; overflow: hidden; background: #111111"><img src="{{c.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></span>
<span style="display: flex; justify-content: space-between; align-items: center; font-family: Archivo, sans-serif; font-size: 18px; font-weight: 800; text-transform: uppercase">{{c.name}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</sc-for>
</div>
</section>

</main>

<dc-import name="Footer" accent="{{accent}}" hint-size="100%,980px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF914C","options":["#FF914C","#FF5F00","#F27420"]},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const B = 'img/';
    return {
      accent: this.props.accent ?? '#FF914C',
      cats: [
        ['Focos', '52dc55c2523393f8f60ab89499fa3ec1'],
        ['Camping', 'a39c65aefaa4235a16422fb671911427'],
        ['Solar', '972ceb606bfca75ef6208d8d3966c77d'],
        ['Cables', '3aba2390d3fbd5f06fdd2cede507b16f'],
        ['Extensiones', '323e29809539c2fb4b229651c8081ee9']
      ].map((c) => ({ name: c[0], img: B + c[1] }))
    };
  }
}
</script>
</body>
</html>
