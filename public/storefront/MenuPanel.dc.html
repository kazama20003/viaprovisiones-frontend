<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú del panel — VIA Provisiones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E9E7}
a{color:inherit}
.mp-card:hover{background:#ECECE9}
.mp-grp:hover{background:#F4F4F2}
.mp-pill:hover{background:#F4F4F2}
.mp-noscroll{scrollbar-width:none;-ms-overflow-style:none}.mp-noscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="font-family: Manrope, system-ui, sans-serif; color: #111111">

<!-- ============ VENTANA: se abre con el botón de menú ============ -->
<sc-if value="{{isPop}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Menú del panel" style="width: 100%; border-radius: 34px; background: #FFFFFF; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 28px 70px rgba(17,17,17,0.28)">

<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="display: flex; flex-direction: column; line-height: 1.15; margin: 0 8px 0 4px"><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Menú</span><span style="font-size: 13px; font-weight: 500; color: #8C8C8C">{{totalText}}</span></span>
<label style="flex: 1 1 260px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 999px; background: #F4F4F2; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar en el menú</span>
<input type="search" onChange="{{onSearch}}" placeholder="Buscar una sección: lotes, cobranzas, cupones…" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; outline: none">
</label>
<button onClick="{{pin}}" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 14px; border-radius: 999px; border: none; background: #F4F4F2; color: #111111; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"></path></svg>Fijar arriba</button>
<button onClick="{{close}}" aria-label="Cerrar menú" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #111111; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap">

<!-- Grupos -->
<div style="flex: 1 1 220px; max-width: 250px; border-radius: 26px; background: #F4F4F2; padding: 8px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<button onClick="{{g.pick}}" class="{{g.cls}}" aria-pressed="{{g.pressed}}" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 10px 0 6px; border-radius: 999px; border: none; background: {{g.bg}}; color: {{g.fg}}; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; text-align: left"><span style="width: 36px; height: 36px; border-radius: 50%; background: {{g.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{g.iconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span><span style="flex: 1">{{g.title}}</span><sc-if value="{{g.alert}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E8701F; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">{{g.alert}}</span></sc-if><span style="font-size: 12px; font-weight: 600; color: {{g.countFg}}">{{g.count}}</span></button>
</sc-for>
</div>

<!-- Opciones del grupo elegido / resultados -->
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 6px 4px">
<sc-if value="{{searching}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">{{resultTitle}}</span>
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}"><span style="padding: 28px; border-radius: 22px; background: #F4F4F2; font-size: 14px; color: #6B6B6B">No hay ninguna sección con ese nombre. Prueba con “pedido”, “lote” o “cliente”.</span></sc-if>
</sc-if>
<sc-if value="{{browsing}}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap"><span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">{{grpTitle}}</span><span style="font-size: 13px; color: #8C8C8C">{{grpDesc}}</span></span>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{shown}}" as="i" hint-placeholder-count="4">
<a href="{{i.href}}" class="{{i.cls}}" aria-current="{{i.current}}" aria-disabled="{{i.disabled}}" style="display: flex; flex-direction: column; gap: 12px; min-height: 112px; padding: 14px; border-radius: 24px; text-decoration: none; background: {{i.bg}}; color: {{i.fg}}; opacity: {{i.o}}; box-sizing: border-box"><span style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="width: 40px; height: 40px; border-radius: 50%; background: {{i.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{i.iconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg></span><sc-if value="{{i.hint}}" hint-placeholder-val="{{ false }}"><span style="height: 24px; padding: 0 10px; border-radius: 999px; background: {{i.hintBg}}; color: {{i.hintFg}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; white-space: nowrap">{{i.hint}}</span></sc-if></span><span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 14px; font-weight: 700">{{i.label}}</span><span style="font-size: 12px; color: {{i.subFg}}">{{i.sub}}</span></span></a>
</sc-for>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px; border-radius: 26px; background: #111111">
<span style="font-size: 13px; font-weight: 700; color: #FFFFFF; padding: 0 8px">Acciones rápidas</span>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<a href="{{a.href}}" style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px 0 12px; border-radius: 999px; background: {{a.bg}}; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>{{a.label}}</a>
</sc-for>
<span style="flex: 1"></span>
<span style="display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF"><span style="width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #111111; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">BC</span><span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 13px; font-weight: 700">Beltran Carlos Ccapa</span><span style="font-size: 11px; color: #9A9A9A">Administrador</span></span></span>
<a href="AdminLogin.dc.html" aria-label="Cerrar sesión" title="Cerrar sesión" style="width: 42px; height: 42px; border-radius: 50%; background: #2A2A2A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg></a>
</div>
</nav>
</sc-if>

<!-- ============ BARRA FIJA ARRIBA: un botón por grupo, cada uno despliega sus opciones ============ -->
<sc-if value="{{isBar}}" hint-placeholder-val="{{ false }}">
<div style="position: relative">
<nav aria-label="Menú del panel" style="display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #FFFFFF">
<div class="mp-noscroll" style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto">
<sc-for list="{{barGroups}}" as="g" hint-placeholder-count="7">
<button onClick="{{g.toggle}}" class="{{g.pillCls}}" aria-expanded="{{g.expanded}}" style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px 0 5px; border-radius: 999px; border: none; background: {{g.barBg}}; color: {{g.barFg}}; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; flex: none"><span style="width: 36px; height: 36px; border-radius: 50%; background: {{g.barIconBg}}; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{g.barIconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span>{{g.title}}<sc-if value="{{g.alert}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E8701F; color: #FFFFFF; font-size: 11px; display: flex; align-items: center; justify-content: center">{{g.alert}}</span></sc-if><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.chev}}"></path></svg></button>
</sc-for>
</div>
<button onClick="{{pin}}" aria-label="Soltar el menú" title="Soltar el menú" style="width: 46px; height: 46px; border-radius: 50%; border: none; background: #111111; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="#E8701F" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"></path></svg></button>
</nav>
<sc-if value="{{barOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 66px; left: 0; right: 0; z-index: 15; border-radius: 28px; background: #FFFFFF; padding: 14px; box-shadow: 0 24px 60px rgba(17,17,17,0.22); display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; align-items: baseline; gap: 12px; padding: 4px 6px 0"><span style="font-size: 18px; font-weight: 700">{{barTitle}}</span><span style="font-size: 13px; color: #8C8C8C">{{barDesc}}</span></span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{barItems}}" as="i" hint-placeholder-count="4">
<a href="{{i.href}}" class="{{i.cls}}" aria-current="{{i.current}}" aria-disabled="{{i.disabled}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; text-decoration: none; background: {{i.bg}}; color: {{i.fg}}; opacity: {{i.o}}"><span style="width: 38px; height: 38px; border-radius: 50%; background: {{i.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{i.iconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 13px; font-weight: 700">{{i.label}}</span><span style="font-size: 12px; color: {{i.subFg}}">{{i.hintOrSub}}</span></span></a>
</sc-for>
</div>
</div>
</sc-if>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF914C","options":["#FF914C","#FF5F00","#F27420"]},"mode":{"editor":"enum","default":"pop","options":["pop","bar"]},"active":{"editor":"enum","default":"Pedidos","options":["Panel","Pedidos","Cotizaciones","Clientes","PuntoVenta","Inventario","Compras","Caja","Gastos","Comprobantes","Devoluciones","Traslados","Ofertas","Banners","Notificaciones","Reportes","Ajustes"]},"onPin":{"editor":null},"onClose":{"editor":null},"$preview":{"width":1100,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { grp: '', q: '', barOpen: '' };
  }
  renderVals() {
    const st = this.state;
    const active = this.props.active ?? 'Pedidos';
    const bar = (this.props.mode ?? 'pop') === 'bar';
    const IC = {
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
      ventas: 'M6 3h12l1 18H5zM9 7a3 3 0 0 0 6 0',
      almacen: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',
      finanzas: 'M3 6h18v12H3zM3 10h18M7 15h4',
      tienda: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18',
      analisis: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      cuenta: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21v-1a8 8 0 0 1 16 0v1',
      panel: 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z',
      pedidos: 'M6 3h12l1 18H5zM9 7a3 3 0 0 0 6 0',
      cotiz: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4',
      clientes: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a7 7 0 0 1 14 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6',
      devol: 'M4 9h11a5 5 0 0 1 0 10H9M4 9l4-4M4 9l4 4',
      inv: 'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',
      compras: 'M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-.1M17 19a2 2 0 1 0 0-.1',
      prov: 'M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6',
      traslado: 'M4 8h13l-3-3M20 16H7l3 3',
      caja: 'M3 6h18v12H3zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      cobro: 'M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6',
      gasto: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
      sunat: 'M7 3h7l5 5v13H7zM14 3v5h5M10 14l2 2 4-4',
      web: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18',
      qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2z',
      cupon: 'M3 8a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 0 0-4V4H3zM10 4v16',
      banner: 'M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6',
      reportes: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      ajustes: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4',
      roles: 'M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z'
    };
    // [id de vista, nombre, descripción, destino, icono, aviso, número, es alerta]; destino vacío = módulo que viene pronto
    const IT = {
      pos: ['PuntoVenta', 'Punto de venta', 'Vender en el mostrador', 'PuntoVenta.dc.html', 'M3 4h18v10H3zM8 20h8M12 14v6M7 9h4'],
      pedidos: ['Pedidos', 'Pedidos', 'Tablero por estado', 'Pedidos.dc.html', IC.pedidos, '8 por atender', 8, true],
      cotiz: ['Cotizaciones', 'Cotizaciones', 'Empresas y mayoristas', 'Cotizaciones.dc.html', IC.cotiz, '5 nuevas', 5, true],
      clientes: ['Clientes', 'Clientes', 'Fichas y cobranzas', 'Clientes.dc.html', IC.clientes, '414'],
      devol: ['Devoluciones', 'Devoluciones', 'Cambios y garantías', 'Devoluciones.dc.html', IC.devol, '2 abiertas', 2, true],
      inv: ['Inventario', 'Inventario y lotes', 'Stock por lote', 'Inventario.dc.html', IC.inv, '6 bajos', 6, true],
      compras: ['Compras', 'Compras', 'Órdenes de compra', 'Compras.dc.html', IC.compras, '3 en camino'],
      prov: ['', 'Proveedores', 'Datos y deudas', 'Compras.dc.html', IC.prov],
      traslado: ['Traslados', 'Traslados', 'Entre tienda y almacén', 'Traslados.dc.html', IC.traslado],
      kardex: ['', 'Kardex', 'Historial por producto y lote', 'Kardex.dc.html', IC.reportes],
      caja: ['Caja', 'Caja del día', 'Apertura, arqueo y cierre', 'Caja.dc.html', IC.caja, 'Abierta'],
      cobro: ['', 'Cobranzas', 'Cuentas por cobrar', 'Clientes.dc.html', IC.cobro, 'S/ 18k'],
      gasto: ['Gastos', 'Gastos', 'Luz, alquiler, sueldos', 'Gastos.dc.html', IC.gasto, '2 por pagar', 2, true],
      sunat: ['Comprobantes', 'Comprobantes SUNAT', 'Boletas y facturas', 'Comprobantes.dc.html', IC.sunat, '3 por emitir', 3, true],
      web: ['', 'Tienda web', 'viaprovisiones.com', 'Main.dc.html', IC.web],
      qr: ['', 'Enlaces y QR', 'Página del QR y redes', 'Enlaces.dc.html', IC.qr],
      cupon: ['Ofertas', 'Ofertas y cupones', 'Descuentos y packs', 'Ofertas.dc.html', IC.cupon, '3 activas'],
      banner: ['Banners', 'Banners de la tienda', 'Portada y anuncios', 'Banners.dc.html', IC.banner],
      panel: ['Panel', 'Panel de inicio', 'Resumen del día', 'Dashboard.dc.html', IC.panel],
      reportes: ['Reportes', 'Reportes', 'Ventas y márgenes', 'Reportes.dc.html', IC.reportes],
      ajustes: ['Ajustes', 'Ajustes', 'Negocio, pagos, envíos', 'Ajustes.dc.html', IC.ajustes],
      roles: ['', 'Usuarios y roles', 'Quién ve qué', 'Ajustes.dc.html', IC.roles],
      notif: ['Notificaciones', 'Notificaciones y perfil', 'Avisos y tu cuenta', 'Notificaciones.dc.html', 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4', '5 sin leer', 5, true]
    };
    const G = [
      ['fav', 'Favoritos', 'Lo que más usas', IC.star, ['pos', 'pedidos', 'inv', 'cotiz', 'caja', 'panel']],
      ['ventas', 'Ventas', 'Mostrador, pedidos y clientes', IC.ventas, ['pos', 'pedidos', 'cotiz', 'clientes', 'devol']],
      ['almacen', 'Almacén', 'Stock, lotes y compras', IC.almacen, ['inv', 'kardex', 'compras', 'prov', 'traslado']],
      ['finanzas', 'Finanzas', 'Caja, cobros y gastos', IC.finanzas, ['caja', 'cobro', 'gasto', 'sunat']],
      ['tienda', 'Tienda y marketing', 'Canales de venta', IC.tienda, ['web', 'qr', 'cupon', 'banner']],
      ['analisis', 'Análisis', 'Cómo va el negocio', IC.analisis, ['panel', 'reportes']],
      ['cuenta', 'Cuenta', 'Configuración', IC.cuenta, ['notif', 'ajustes', 'roles']]
    ];
    const item = (k) => {
      const x = IT[k];
      const on = x[0] !== '' && x[0] === active;
      const soon = x[3] === '';
      return {
        key: k, label: x[1], sub: soon ? 'Próximamente' : x[2], href: soon ? '#pronto' : x[3], icon: x[4],
        hint: soon ? 'Pronto' : (x[5] || ''), hintOrSub: soon ? 'Próximamente' : (x[5] || x[2]),
        n: x[6] || 0,
        cls: on || soon ? '' : 'mp-card', current: on ? 'page' : 'false', disabled: soon ? 'true' : 'false',
        bg: on ? '#111111' : '#F4F4F2', fg: on ? '#FFFFFF' : '#111111', subFg: on ? '#BDBDBD' : '#8C8C8C', o: soon ? '0.55' : '1',
        iconBg: on ? '#E8701F' : '#FFFFFF', iconFg: on ? '#FFFFFF' : '#111111',
        hintBg: on ? '#2A2A2A' : (x[7] ? '#FFF1E6' : '#FFFFFF'), hintFg: on ? '#FFFFFF' : (x[7] ? '#8A3B0A' : '#6B6B6B'),
        isOn: on
      };
    };
    const home = (G.find((g) => g[0] !== 'fav' && g[4].some((k) => IT[k][0] === active)) || G[0])[0];
    const sel = st.grp || 'fav';
    const groups = G.map((g) => {
      const items = g[4].map(item);
      const alert = items.reduce((a, i) => a + i.n, 0);
      const on = g[0] === sel;
      const here = g[0] === home;
      const open = st.barOpen === g[0];
      return {
        id: g[0], title: g[1], desc: g[2], icon: g[3], items,
        alert: g[0] === 'fav' ? '' : (alert ? String(alert) : ''), count: String(items.length),
        pick: () => this.setState({ grp: g[0], q: '' }),
        pressed: on ? 'true' : 'false', cls: on ? '' : 'mp-grp',
        bg: on ? '#FFFFFF' : 'transparent', fg: '#111111', countFg: '#8C8C8C',
        iconBg: on ? '#111111' : '#FFFFFF', iconFg: on ? '#FFFFFF' : '#111111',
        toggle: () => this.setState({ barOpen: open ? '' : g[0] }),
        expanded: open ? 'true' : 'false', pillCls: here || open ? '' : 'mp-pill',
        barBg: here ? '#111111' : (open ? '#F4F4F2' : 'transparent'), barFg: here ? '#FFFFFF' : '#111111',
        barIconBg: here ? '#E8701F' : '#F4F4F2', barIconFg: here ? '#FFFFFF' : '#111111',
        chev: open ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'
      };
    });
    const cur = groups.find((g) => g.id === sel) || groups[0];
    const q = st.q.trim().toLowerCase();
    const seen = {};
    const results = q ? Object.keys(IT).filter((k) => { const x = IT[k]; return (x[1] + ' ' + x[2]).toLowerCase().indexOf(q) !== -1; }).map(item).filter((i) => (seen[i.key] ? false : (seen[i.key] = true))) : [];
    const bg = groups.find((g) => g.id === st.barOpen);
    const total = Object.keys(IT).length;
    return {
      accent: this.props.accent ?? '#FF914C',
      isPop: !bar,
      isBar: bar,
      totalText: total + ' secciones en ' + (G.length - 1) + ' grupos',
      close: () => { if (this.props.onClose) this.props.onClose(); },
      pin: () => { if (this.props.onPin) this.props.onPin(); },
      onSearch: (e) => this.setState({ q: (e && e.target && e.target.value) || '' }),
      groups,
      searching: !!q,
      browsing: !q,
      noResults: !!q && results.length === 0,
      resultTitle: results.length + (results.length === 1 ? ' resultado' : ' resultados') + ' para “' + st.q.trim() + '”',
      grpTitle: cur.title,
      grpDesc: cur.desc,
      shown: q ? results : cur.items,
      barGroups: groups.filter((g) => g.id !== 'fav'),
      barOpen: !!bg,
      barTitle: bg ? bg.title : '',
      barDesc: bg ? bg.desc : '',
      barItems: bg ? bg.items : [],
      actions: [
        ['Vender', 'PuntoVenta.dc.html', 'M12 5v14M5 12h14', '#E8701F'],
        ['Nuevo pedido', 'Pedidos.dc.html', IC.pedidos, '#2A2A2A'],
        ['Cotización', 'Cotizaciones.dc.html', IC.cotiz, '#2A2A2A'],
        ['Ingresar lote', 'Inventario.dc.html', IC.inv, '#2A2A2A'],
        ['Orden de compra', 'Compras.dc.html', IC.compras, '#2A2A2A']
      ].map((a) => ({ label: a[0], href: a[1], icon: a[2], bg: a[3] }))
    };
  }
}
